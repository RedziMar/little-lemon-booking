<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Step 1: SEO Description -->
    <meta
      name="description"
      content="Little Lemon is a family-owned Mediterranean restaurant in Chicago serving traditional recipes with a modern twist. View our weekly specials and reserve a table online."
    />

    <!-- Steps 2–4: Open Graph Protocol (OGP) Meta Tags -->
    <meta
      name="og:title"
      content="Little Lemon | Mediterranean Restaurant & Table Reservations"
    />
    <meta
      name="og:description"
      content="Reserve your table online at Little Lemon Chicago. Enjoy fresh Mediterranean dishes, weekly specials, and effortless special-occasion bookings."
    />
    <meta name="og:image" content="/restauranfood.jpg" />

    <title>Little Lemon | Mediterranean Restaurant & Table Reservations</title>

    <!-- Little Lemon Style Guide Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700;800&family=Markazi+Text:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://raw.githubusercontent.com/courseraap/capstone/main/api.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
